name: Proto Contracts CI

on:
  push:
    branches: ["main"]
    paths:
      - "proto-contracts/**"
      - ".github/workflows/proto-contracts.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "proto-contracts/**"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup protolint
        uses: yoheimuta/action-setup-protolint@v1

      - name: Run protolint
        run: protolint lint ./proto-contracts/src/main/proto

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate and compile proto-contracts
        run: ./gradlew :proto-contracts:build --no-daemon