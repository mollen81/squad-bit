syntax = "proto3";

package com.squad.clan.grpc;

option java_multiple_files = true;
option java_package = "com.squad.clan.grpc";


service ClanService {
  rpc GetClanWithMembers (GetClanRequest) returns (GetClanResponse);

  rpc GetAllClans (GetAllClansRequest) returns (GetAllClansResponse);

  rpc GetClanIdFromUserId (GetClanIdFromUserIdRequest) returns (GetClanIdFromUserIdResponse);

  rpc CreateClan (CreateClanRequest) returns (CreateClanResponse);

  rpc ApplyToClan (ApplyToClanRequest) returns (ApplyToClanResponse);

  rpc ProcessAcceptance (ProcessAcceptanceRequest) returns (ProcessAcceptanceResponse);
}


// domain

message ClanDto {
  string id = 1;
  string name = 2;
  string tag = 3;
  string description = 4;
  string requirements = 5;
  string avatar_url = 6;
  bool is_recruiting = 7;
  string status = 8;
  int32 total_elo = 9;
  int32 min_elo = 10;
  string created_at = 11;
  repeated ClanMemberDto members = 12;
}

message ClanMemberDto {
  string id = 1;
  string user_id = 2;
  string role = 3; // LEADER, MODERATOR, MEMBER
}

message PageInfo {
  int32 current_page = 1;
  int32 rpp = 2;
  int64 total_elements = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  ASC = 1;
  DESC = 2;
}


// getClanWithMembers
message GetClanRequest {
  string clan_id = 1;
}

message GetClanResponse {
  ClanDto clan = 1;
}


// getAllClans
message GetAllClansRequest {
  int32 page = 1;
  int32 rpp = 2;
  string sortBy = 3;
  string sortDir = 4;
}

message GetAllClansResponse {
  repeated ClanDto clans = 1;
  PageInfo page_info = 2;
}


message GetClanIdFromUserIdRequest {
  string userId = 1;
}

message GetClanIdFromUserIdResponse {
  string clanId = 1;
}


message CreateClanRequest {
  string leader_id = 1;
  string name = 2;
  string tag = 3;
  string description = 4;
  string requirements = 5;
  string avatar_url = 6;
}

message CreateClanResponse {
  string clan_id = 1;
  string message = 2;
}


message ApplyToClanRequest {
  string user_id = 1;
  string clan_id = 2;
  string social_link = 3;
  string experience_text = 4;
}

message ApplyToClanResponse {
  string application_id = 1;
  string message = 2;
}


message ProcessAcceptanceRequest {
  string applicationId = 1;
  string acceptorId = 2;
}

message ProcessAcceptanceResponse {
  ClanMemberDto newMember = 1;
  string message = 2;
}